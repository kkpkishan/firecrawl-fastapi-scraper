name: Build & Deploy Docker

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    environment: docker
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: fastapi-app
            context: ./app
            dockerfile: Dockerfile

          - service: firecrawl-api
            context: ./apps/api
            dockerfile: Dockerfile

          - service: nuq-postgres
            context: ./apps/nuq-postgres
            dockerfile: Dockerfile

          - service: playwright-service
            context: ./apps/playwright-service-ts
            dockerfile: Dockerfile

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Extract short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Set up QEMU (for multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push multi-arch image for ${{ matrix.service }}
        run: |
          docker buildx create --use

          echo "Building multi-arch image for service: ${{ matrix.service }}"
          echo "SHORT_SHA=${SHORT_SHA}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${{ secrets.DOCKERHUB_REPO }}:${{ matrix.service }}-${SHORT_SHA}" \
            --tag "${{ secrets.DOCKERHUB_REPO }}:${{ matrix.service }}-latest" \
            --file "${{ matrix.context }}/${{ matrix.dockerfile }}" \
            --push \
            "${{ matrix.context }}"
